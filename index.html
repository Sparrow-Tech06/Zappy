
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coin Logic</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Vue 3 CDN -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>
:root{
  --primary:#5f7cff;
  --locked:#d7def3;
  --bg:#fff;
  --text:#1e2a4a;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
}

body{
  background:var(--bg);
}

/* Layout */
.app{
  max-width:420px;
  margin:auto;
  padding:16px;
}

/* Levels */
.level-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.level{
  background:var(--primary);
  box-shadow:0 10px 20px rgba(95,124,255,.35);
  color:#fff;
  padding:16px;
  text-align:center;
  aspect-ratio:1/1;
  clip-path: polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%);
  cursor:pointer;
  transition:.25s;
}
.level:hover{
  transform:translateY(-4px);
}
.level.locked{
  background:var(--locked);
  color:#8e9ac5;
  box-shadow:none;
  cursor:not-allowed;
  opacity:.7;
}
.level.locked:hover{
  transform:none;
}

/* Skeleton */
.skeleton{
  height:80px;
  background:linear-gradient(90deg,#eee,#f5f5f5,#eee);
  background-size:200% 100%;
  animation:shimmer 1.2s infinite;
  border-radius:14px;
}
@keyframes shimmer{
  from{background-position:200% 0}
  to{background-position:-200% 0}
}

/* Game */
.game{
  background:#fff;
  border-radius:16px;
  padding:16px;
  box-shadow:0 8px 20px rgba(0,0,0,.15);
  animation:fadeIn .3s ease;
}
@keyframes fadeIn{
  from{opacity:0; transform:scale(.96)}
  to{opacity:1; transform:scale(1)}
}

.coin{
  background:#e3f2fd;
  border-radius:12px;
  padding:14px;
  text-align:center;
  cursor:pointer;
  font-weight:bold;
  transition:.2s;
}
.coin:hover{
  background:#bbdefb;
  transform:scale(1.05);
}
.amount{
  font-size:32px;
  text-align:center;
}
.progress{
  height:6px;
}

/* Popup */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.popup{
  background:#fff;
  width:90%;
  max-width:320px;
  border-radius:18px;
  padding:20px;
  text-align:center;
  animation:pop .25s ease;
}
@keyframes pop{
  from{transform:scale(.85)}
  to{transform:scale(1)}
}
</style>
</head>

<body>
<div id="app"></div>

<script>
const { createApp } = Vue;

createApp({
  data(){
    return{
      levels:[],
      screen:"home",
      current:null,
      popup:null,
      progress: JSON.parse(localStorage.getItem("progress") || "{}")
    }
  },

  mounted(){
    fetch("math.json?v="+Date.now())
      .then(r=>r.json())
      .then(d=>this.levels=d.levels);
  },

  methods:{
    /* 🔐 CHECK LOCK */
    isUnlocked(l,i){
      return i===0 || this.progress[this.levels[i-1].id];
    },

    /* 🚫 LOCKED LEVEL BLOCK */
    startLevel(lvl,index){
      if(!this.isUnlocked(lvl,index)) return;

      this.popup=null;
      this.current={
        ...lvl,
        amount:0,
        movesLeft:lvl.moves
      };
      this.screen="game";
    },

    saveStars(id,stars){
      this.progress[id]=Math.max(this.progress[id]||0,stars);
      localStorage.setItem("progress",JSON.stringify(this.progress));
    },

    tapCoin(val){
      if(this.current.movesLeft<=0 || this.popup) return;

      this.current.amount+=val;
      this.current.movesLeft--;

      if(this.current.amount===this.current.target){
        const stars=this.current.movesLeft>=2?3:this.current.movesLeft===1?2:1;
        this.saveStars(this.current.id,stars);
        this.popup={type:"success",stars};
      }
      else if(this.current.movesLeft===0){
        this.popup={type:"fail"};
      }
    },

    retry(){
      const lvl=this.current;
      this.popup=null;
      this.startLevel(lvl, this.levels.findIndex(l=>l.id===lvl.id));
    },

    nextLevel(){
      const idx=this.levels.findIndex(l=>l.id===this.current.id);
      const next=this.levels[idx+1];
      this.popup=null;
      next?this.startLevel(next,idx+1):this.screen="home";
    }
  },

  computed:{
    progressPercent(){
      return ((this.current.moves-this.current.movesLeft)/this.current.moves)*100;
    }
  },

  template:`
<main class="app">

<!-- HOME -->
<section v-if="screen==='home'">
  <header class="text-center mb-3">
    <h3>🪙 Coin Logic</h3>
  </header>

  <section class="level-grid">
    <div v-if="levels.length===0"
      v-for="i in 6" :key="i" class="skeleton"></div>

    <article v-for="(l,i) in levels" :key="l.id"
      class="level"
      :class="{locked:!isUnlocked(l,i)}"
      @click="startLevel(l,i)">
      <div>Level {{l.id}}</div>
      <small>{{'⭐'.repeat(progress[l.id]||0)}}</small>
    </article>
  </section>
</section>

<!-- GAME -->
<section v-else class="game">
  <header class="d-flex justify-content-between fw-bold">
    <span>Level {{current.id}}</span>
    <span>Moves {{current.movesLeft}}</span>
  </header>

  <small class="text-muted">Target ₹{{current.target}}</small>

  <div class="progress my-2">
    <div class="progress-bar bg-warning"
      :style="{width:(100-progressPercent)+'%'}"></div>
  </div>

  <div class="amount my-3">₹{{current.amount}}</div>

  <div class="row g-2">
    <div v-for="(c,i) in current.coins" :key="i" class="col-4">
      <div class="coin" @click="tapCoin(c)">+{{c}}</div>
    </div>
  </div>

  <button class="btn btn-secondary w-100 mt-3"
    @click="screen='home'">Exit</button>
</section>

<!-- POPUP -->
<div v-if="popup" class="overlay">
  <div class="popup">
    <template v-if="popup.type==='success'">
      <h5>Level Complete 🎉</h5>
      <p>You earned {{popup.stars}} ⭐</p>
      <button class="btn btn-success w-100 mb-2" @click="nextLevel">
        Next Level
      </button>
    </template>

    <template v-else>
      <h5>Failed 😢</h5>
      <button class="btn btn-warning w-100 mb-2" @click="retry">
        Try Again
      </button>
    </template>

    <button class="btn btn-outline-secondary w-100"
      @click="popup=null;screen='home'">Home</button>
  </div>
</div>

</main>
`
}).mount("#app");
</script>
</body>
</html>
