<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coin Logic</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Vue 3 CDN -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>
body{
  background: ;
}
.app{
  max-width:420px;
  margin:auto;
  padding:16px;
}
.level-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.level{
  background:#fff;
  border-radius:14px;
  padding:16px;
  text-align:center;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
  cursor:pointer;
}
.level.locked{
  opacity:.4;
  pointer-events:none;
}

/* Skeleton */
.skeleton{
  height:70px;
  background:linear-gradient(90deg,#eee,#f5f5f5,#eee);
  background-size:200% 100%;
  animation:shimmer 1.2s infinite;
  border-radius:14px;
}
@keyframes shimmer{
  from{background-position:200% 0}
  to{background-position:-200% 0}
}

/* Game */
.game{
  background:#fff;
  border-radius:16px;
  padding:16px;
  box-shadow:0 8px 20px rgba(0,0,0,.15);
}
.coin{
  background:#e3f2fd;
  border-radius:12px;
  padding:14px;
  text-align:center;
  cursor:pointer;
  font-weight:bold;
}
.amount{
  font-size:32px;
  text-align:center;
}
.progress{
  height:6px;
}
</style>
</head>

<body>
<div id="app"></div>

<script>
const { createApp } = Vue;

createApp({
  data(){
    return{
      levels:[],
      screen:"home",
      current:null,
      popup:null,
      progress: JSON.parse(localStorage.getItem("progress") || "{}")
    }
  },

  mounted(){
    fetch("math.json")
      .then(res=>res.json())
      .then(data=>this.levels=data.levels);
  },

  methods:{
    startLevel(lvl){
      this.current = {
        ...lvl,
        amount:0,
        movesLeft:lvl.moves
      };
      this.screen="game";
    },

    saveStars(id,stars){
      this.progress[id]=Math.max(this.progress[id]||0,stars);
      localStorage.setItem("progress",JSON.stringify(this.progress));
    },

    tapCoin(val){
      if(this.current.movesLeft<=0) return;

      this.current.amount += val;
      this.current.movesLeft--;

      if(this.current.amount === this.current.target){
        const stars = this.current.movesLeft>=2 ? 3 :
                      this.current.movesLeft===1 ? 2 : 1;
        this.saveStars(this.current.id,stars);
        this.popup={type:"success",stars};
      }
      else if(this.current.movesLeft===0){
        this.popup={type:"fail"};
      }
    },

    nextLevel(){
      const idx = this.levels.findIndex(l=>l.id===this.current.id);
      const next = this.levels[idx+1];
      this.popup=null;
      next ? this.startLevel(next) : this.screen="home";
    }
  },

  computed:{
    progressPercent(){
      return ((this.current.moves-this.current.movesLeft)/this.current.moves)*100;
    }
  },

  template:`
<div class="app">

  <!-- HOME -->
  <div v-if="screen==='home'">
    <h3 class="text-center mb-3">🪙 Coin Logic</h3>

    <div class="level-grid">
      <div v-if="levels.length===0"
        v-for="i in 6" :key="i" class="skeleton"></div>

      <div v-for="(l,i) in levels" :key="l.id"
        class="level"
        :class="{locked: !(i===0 || progress[levels[i-1].id])}"
        @click="startLevel(l)">
        <div>Level {{l.id}}</div>
        <small>{{ '⭐'.repeat(progress[l.id]||0) }}</small>
      </div>
    </div>
  </div>

  <!-- GAME -->
  <div v-else class="game">
    <div class="d-flex justify-content-between fw-bold">
      <span>Target ₹{{current.target}}</span>
      <span>Moves {{current.movesLeft}}</span>
    </div>

    <div class="progress my-2">
      <div class="progress-bar bg-warning"
        :style="{width:(100-progressPercent)+'%'}"></div>
    </div>

    <div class="amount my-3">₹{{current.amount}}</div>

    <div class="row g-2">
      <div v-for="(c,i) in current.coins" :key="i" class="col-4">
        <div class="coin" @click="tapCoin(c)">+{{c}}</div>
      </div>
    </div>

    <button class="btn btn-secondary w-100 mt-3"
      @click="screen='home'">Exit</button>
  </div>

  <!-- POPUP -->
  <div v-if="popup" class="modal fade show d-block">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 text-center p-3">

        <template v-if="popup.type==='success'">
          <h5>Level Complete 🎉</h5>
          <p>You earned {{popup.stars}} ⭐</p>
          <button class="btn btn-success w-100 mb-2" @click="nextLevel">
            Next Level
          </button>
        </template>

        <template v-else>
          <h5>Failed 😢</h5>
          <p>Try again</p>
          <button class="btn btn-warning w-100 mb-2"
            @click="startLevel(current)">
            Retry
          </button>
        </template>

        <button class="btn btn-outline-secondary w-100"
          @click="popup=null;screen='home'">
          Home
        </button>

      </div>
    </div>
  </div>

</div>
`
}).mount("#app");
</script>
</body>
</html>
