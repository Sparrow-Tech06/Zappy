<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coin Logic</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Vue 3 CDN -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>
body{
  background:#f4f6fb;
}

/* Layout */
.app{
  max-width:420px;
  margin:auto;
  padding:16px;
}

/* Levels */
.level-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.level{
  background:#fff;
  border-radius: ;
  padding:16px;
  text-align:center;
  aspect-ratio: 1; 
  clip-path: polygon(100% 50%,90.45% 79.39%,65.45% 97.55%,34.55% 97.55%,9.55% 79.39%,0% 50%,9.55% 20.61%,34.55% 2.45%,65.45% 2.45%,90.45% 20.61%);
  cursor:pointer;
  transition:.3s ease;
}
.level:hover{
  transform:translateY(-4px);
}
.level.locked{
  opacity:.4;
  pointer-events:none;
}

/* Skeleton */
.skeleton{
  height:70px;
  background:linear-gradient(90deg,#eee,#f5f5f5,#eee);
  background-size:200% 100%;
  animation:shimmer 1.2s infinite;
  border-radius:14px;
}
@keyframes shimmer{
  from{background-position:200% 0}
  to{background-position:-200% 0}
}

/* Game */
.game{
  background:#fff;
  border-radius:16px;
  padding:16px;
  box-shadow:0 8px 20px rgba(0,0,0,.15);
  animation:fadeIn .4s ease;
}
@keyframes fadeIn{
  from{opacity:0; transform:scale(.96)}
  to{opacity:1; transform:scale(1)}
}

.coin{
  background:#e3f2fd;
  border-radius:12px;
  padding:14px;
  text-align:center;
  cursor:pointer;
  font-weight:bold;
  transition:.2s;
}
.coin:hover{
  background:#bbdefb;
  transform:scale(1.05);
}
.amount{
  font-size:32px;
  text-align:center;
}
.progress{
  height:6px;
}

/* Popup Overlay */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
  animation:fadeOverlay .3s ease;
}
@keyframes fadeOverlay{
  from{opacity:0}
  to{opacity:1}
}
.popup{
  background:#fff;
  width:90%;
  max-width:320px;
  border-radius:18px;
  padding:20px;
  text-align:center;
  animation:pop .3s ease;
}
@keyframes pop{
  from{transform:scale(.85)}
  to{transform:scale(1)}
}
</style>
</head>

<body>
<div id="app"></div>

<script>
const { createApp } = Vue;

createApp({
  data(){
    return{
      levels:[],
      screen:"home",
      current:null,
      popup:null,
      progress: JSON.parse(localStorage.getItem("progress") || "{}")
    }
  },

  mounted(){
    fetch("math.json")
      .then(res=>res.json())
      .then(data=>this.levels=data.levels);
  },

  methods:{
    startLevel(lvl){
      this.popup=null;
      this.current = {
        ...lvl,
        amount:0,
        movesLeft:lvl.moves
      };
      this.screen="game";
    },

    saveStars(id,stars){
      this.progress[id]=Math.max(this.progress[id]||0,stars);
      localStorage.setItem("progress",JSON.stringify(this.progress));
    },

    tapCoin(val){
      if(this.current.movesLeft<=0 || this.popup) return;

      this.current.amount += val;
      this.current.movesLeft--;

      if(this.current.amount === this.current.target){
        const stars = this.current.movesLeft>=2 ? 3 :
                      this.current.movesLeft===1 ? 2 : 1;
        this.saveStars(this.current.id,stars);
        this.popup={type:"success",stars};
      }
      else if(this.current.movesLeft===0){
        this.popup={type:"fail"};
      }
    },

    retry(){
      const lvl = this.current;
      this.popup=null;
      this.startLevel(lvl);
    },

    nextLevel(){
      const idx = this.levels.findIndex(l=>l.id===this.current.id);
      const next = this.levels[idx+1];
      this.popup=null;
      next ? this.startLevel(next) : this.screen="home";
    }
  },

  computed:{
    progressPercent(){
      return ((this.current.moves-this.current.movesLeft)/this.current.moves)*100;
    }
  },

  template:`
<main class="app">

  <!-- HOME -->
  <section v-if="screen==='home'">
    <header class="text-center mb-3">
      <h3>🪙 Coin Logic</h3>
    </header>

    <section class="level-grid">
      <div v-if="levels.length===0"
        v-for="i in 6" :key="i" class="skeleton"></div>

      <article v-for="(l,i) in levels" :key="l.id"
        class="level"
        :class="{locked: !(i===0 || progress[levels[i-1].id])}"
        @click="startLevel(l)">
        <div>Level {{l.id}}</div>
        <small>{{ '⭐'.repeat(progress[l.id]||0) }}</small>
      </article>
    </section>
  </section>

  <!-- GAME -->
  <section v-else class="game">
    <header class="d-flex justify-content-between fw-bold mb-1">
      <span>Level {{current.id}}</span>
      <span>Moves {{current.movesLeft}}</span>
    </header>

    <small class="text-muted">Target ₹{{current.target}}</small>

    <div class="progress my-2">
      <div class="progress-bar bg-warning"
        :style="{width:(100-progressPercent)+'%'}"></div>
    </div>

    <div class="amount my-3">₹{{current.amount}}</div>

    <section class="row g-2">
      <div v-for="(c,i) in current.coins" :key="i" class="col-4">
        <div class="coin" @click="tapCoin(c)">+{{c}}</div>
      </div>
    </section>

    <footer>
      <button class="btn btn-secondary w-100 mt-3"
        @click="screen='home'">Exit</button>
    </footer>
  </section>

  <!-- POPUP -->
  <div v-if="popup" class="overlay">
    <div class="popup">

      <template v-if="popup.type==='success'">
        <h5>Level Complete 🎉</h5>
        <p>You earned {{popup.stars}} ⭐</p>
        <button class="btn btn-success w-100 mb-2" @click="nextLevel">
          Next Level
        </button>
      </template>

      <template v-else>
        <h5>Failed 😢</h5>
        <p>Try again</p>
        <button class="btn btn-warning w-100 mb-2" @click="retry">
          Try Again
        </button>
      </template>

      <button class="btn btn-outline-secondary w-100"
        @click="popup=null;screen='home'">
        Home
      </button>

    </div>
  </div>

</main>
`
}).mount("#app");
</script>
</body>
</html>
